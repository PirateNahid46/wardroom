<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d353b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Wardroom Bill</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Wardroom Bill</h1>
      <p id="hdr-sub" class="muted"></p>
    </div>
    <button class="icon-btn" data-act="theme" aria-label="Switch light or dark theme">◐</button>
  </header>

  <main>
    <section id="view-log"></section>
    <section id="view-bill" hidden></section>
    <section id="view-prices" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button data-act="tab" data-tab="log" class="tab active"><span class="tab-ico">🍽</span><span>Log</span></button>
    <button data-act="tab" data-tab="bill" class="tab"><span class="tab-ico">🧾</span><span>Bill</span></button>
    <button data-act="tab" data-tab="prices" class="tab"><span class="tab-ico">🏷</span><span>Prices</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-act="close-modal"></div>
    <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h2 id="m-title"></h2>
      <label for="m-name">Name</label>
      <input id="m-name" type="text" maxlength="40" autocomplete="off">
      <label for="m-price">Charge</label>
      <input id="m-price" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
      <div class="sheet-actions">
        <button class="btn btn-danger" id="m-delete" data-act="delete-item">Delete</button>
        <span class="spacer"></span>
        <button class="btn" data-act="close-modal">Cancel</button>
        <button class="btn btn-primary" data-act="save-item">Save</button>
      </div>
    </div>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
